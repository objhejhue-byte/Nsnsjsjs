<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sight Reading Trainer</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf8f4;--fg:#1d1d1f;--mut:#6b6b70;--card:#fff;--line:#d8d4cc;--acc:#3a5ccc;--ok:#1f9d55;--bad:#d64545}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181b;--fg:#ececee;--mut:#9a9aa3;--card:#222428;--line:#3a3d44;--acc:#7f9cff;--ok:#43c47a;--bad:#ff6b6b}}
:root[data-theme="dark"]{--bg:#17181b;--fg:#ececee;--mut:#9a9aa3;--card:#222428;--line:#3a3d44;--acc:#7f9cff;--ok:#43c47a;--bad:#ff6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:40px;height:40px;font-size:20px;padding:0}
.step b{min-width:20px;text-align:center;font-size:20px}
.badge{display:inline-block;font-weight:700;font-size:13px;letter-spacing:.06em;padding:3px 10px;border-radius:99px;background:var(--acc);color:var(--bg)}
svg{width:100%;height:auto;display:block}
.ln{stroke:var(--fg);stroke-width:1.4}.lg{stroke:var(--fg);stroke-width:1.6}
.nh{fill:var(--fg)}
.ok .nh{fill:var(--ok)}.bad .nh{fill:var(--bad)}
.bad{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.kb{display:flex;overflow-x:auto;gap:2px;padding-bottom:6px}
.k{flex:0 0 46px;height:128px;border-radius:0 0 8px 8px;background:#fff;color:#444;border:1px solid #aaa;display:flex;align-items:flex-end;justify-content:center;padding:6px 0;font-size:11px}
.k.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.stats{font-size:14px;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mut);margin:6px 0 0}
</style></head><body><main>
<div class="card">
<div class="row">
<label>Notes per turn<span class="step"><button id="m">−</button><b id="n">3</b><button id="p">+</button></span></label>
<label>Clef<select id="mode"><option value="alt">Alternate</option><option value="treble">Treble</option><option value="bass">Bass</option><option value="rand">Random</option></select></label>
<label>One-hand reach<select id="span"><option value="7">Up to a 5th</option><option value="9" selected>Up to a 6th</option><option value="12">Up to an octave</option></select></label>
</div></div>
<div class="card">
<div class="row"><span class="badge" id="clef">TREBLE</span><span id="prog" class="stats"></span></div>
<div id="staff"></div>
</div>
<div class="card">
<div class="kb" id="kb"></div>
<div class="row" style="margin-top:8px"><button id="skip">Skip</button><button id="midi">Connect MIDI</button></div>
<p class="hint" id="ms">Tap the keys together (any order), or play on a MIDI keyboard.</p>
</div>
<div class="stats" id="stats"></div>
</main>
<script>
const L={0:0,2:1,4:2,5:3,7:4,9:5,11:6},NM='CDEFGAB';
const nat=m=>(m%12) in L,dia=m=>7*(Math.floor(m/12)-1)+L[m%12],nm=m=>NM[L[m%12]]+(Math.floor(m/12)-1);
const R={treble:{lo:60,hi:81,base:30,kb:[60,84]},bass:{lo:40,hi:60,base:18,kb:[36,62]}};
const whites=(a,b)=>{const r=[];for(let m=a;m<=b;m++)if(nat(m))r.push(m);return r};
const $=id=>document.getElementById(id);
let N=3,clef='bass',target=[],sel=new Set(),ok=0,bad=0,streak=0,locked=false;
function gen(c,n,span){const w=whites(R[c].lo,R[c].hi);
for(let t=0;t<300;t++){const lo=w[Math.random()*w.length|0];const pool=w.filter(m=>m>lo&&m<=lo+span).sort(()=>Math.random()-.5);
if(pool.length>=n-1)return[lo,...pool.slice(0,n-1)].sort((a,b)=>a-b)}
return w.slice(0,n)}
function draw(c,notes,cls){const r=R[c],Y=s=>130-s*6,st=notes.map(m=>dia(m)-r.base);let s='',off=[];
for(let i=0;i<5;i++)s+=`<line class="ln" x1="30" x2="290" y1="${Y(i*2)}" y2="${Y(i*2)}"/>`;
let h='';
st.forEach((v,i)=>{let x=160;if(i&&v-st[i-1]===1&&!off[i-1]){x=174;off[i]=true}
for(let k=-2;k>=v;k-=2)s+=`<line class="lg" x1="${x-15}" x2="${x+15}" y1="${Y(k)}" y2="${Y(k)}"/>`;
for(let k=10;k<=v;k+=2)s+=`<line class="lg" x1="${x-15}" x2="${x+15}" y1="${Y(k)}" y2="${Y(k)}"/>`;
h+=`<ellipse class="nh" cx="${x}" cy="${Y(v)}" rx="8" ry="6" transform="rotate(-20 ${x} ${Y(v)})"/>`});
$('staff').innerHTML=`<svg viewBox="0 40 320 130" class="${cls||''}">${s}${h}</svg>`}
function kb(){const[a,b]=R[clef].kb;$('kb').innerHTML=whites(a,b).map(m=>`<button class="k${sel.has(m)?' on':''}" data-m="${m}">${m%12==0?nm(m):''}</button>`).join('')}
function stats(){$('stats').innerHTML=`<span>✓ ${ok}</span><span>✗ ${bad}</span><span>Streak ${streak}</span>`;$('prog').textContent=`${sel.size}/${N} notes`;$('n').textContent=N}
function next(first){const mode=$('mode').value;
clef=mode==='alt'?(first?'treble':clef==='treble'?'bass':'treble'):mode==='rand'?(Math.random()<.5?'treble':'bass'):mode;
target=gen(clef,N,+$('span').value);sel.clear();locked=false;
$('clef').textContent=clef.toUpperCase();draw(clef,target);kb();stats()}
function pick(m,add){if(locked)return;if(sel.has(m)&&!add)sel.delete(m);else sel.add(m);
if(sel.size<N){kb();stats();return}
const good=target.length===sel.size&&target.every(t=>sel.has(t));locked=true;kb();stats();
if(good){ok++;streak++;draw(clef,target,'ok');stats();setTimeout(()=>next(),450)}
else{bad++;streak=0;draw(clef,target,'bad');setTimeout(()=>{sel.clear();locked=false;draw(clef,target);kb();stats()},500)}}
$('kb').onclick=e=>{const b=e.target.closest('.k');if(b)pick(+b.dataset.m,false)};
$('m').onclick=()=>{if(N>1){N--;next(true)}};$('p').onclick=()=>{if(N<5){N++;next(true)}};
$('mode').onchange=()=>next(true);$('span').onchange=()=>next(true);$('skip').onclick=()=>next();
function wire(a){a.inputs.forEach(i=>i.onmidimessage=e=>{const[s,m,v]=e.data;if((s&240)===144&&v>0)pick(m,true)})}
$('midi').onclick=async()=>{if(!navigator.requestMIDIAccess){$('ms').textContent='Web MIDI is not supported in this browser.';return}
try{const a=await navigator.requestMIDIAccess();wire(a);a.onstatechange=()=>wire(a);$('ms').textContent=a.inputs.size?'MIDI connected — play the notes together.':'MIDI allowed, but no keyboard detected.'}
catch(e){$('ms').textContent='MIDI blocked here — use the on-screen keys, or open the page on its own tab.'}};
next(true);
</script></body></html>
